[project]
name = "lsl-backend"
version = "0.1.0"
description = "Backend dependency manifest for LSL"
requires-python = ">=3.10,<3.14"
dependencies = [
    "alibabacloud-oss-v2>=1.2,<2",
    "fastapi>=0.128,<1",
    "httpx>=0.28,<1",
    "json-repair>=0.58,<1",
    "openai>=2.26,<3",
    "psycopg[binary]>=3.3,<4",
    "psycopg-pool>=3.3,<4",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.2,<2",
    "redis>=7.3,<8",
    "requests>=2.32,<3",
    "sqlalchemy>=2.0,<3",
    "trafilatura>=2.0,<3",
    "uvicorn>=0.40,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
]

[tool.uv]
package = false
